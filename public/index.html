<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAM 统一身份认证</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 420px; padding: 40px; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    h1 { text-align: center; margin-bottom: 20px; color: #333; font-size: 22px; }
    .tab { display: flex; margin-bottom: 25px; background: #f0f0f0; border-radius: 8px; padding: 4px; }
    .tab button { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; border-radius: 6px; font-size: 14px; transition: all 0.3s; }
    .tab button.active { background: #007bff; color: white; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: border 0.3s; }
    .form-group input:focus { outline: none; border-color: #007bff; }
    .radio-group { display: flex; gap: 20px; margin-bottom: 15px; }
    .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 14px; }
    .optional { color: #999; font-size: 12px; font-weight: normal; }
    button.submit { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    button.submit:hover { background: #0056b3; }
    .message { padding: 12px; margin-top: 15px; border-radius: 6px; display: none; font-size: 14px; }
    .message.success { background: #d4edda; color: #155724; display: block; }
    .message.error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 IAM 统一身份认证</h1>
    
    <div class="tab">
      <button class="active" onclick="switchTab('login')">登录</button>
      <button onclick="switchTab('register')">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>账号（用户名 / 邮箱 / 手机号）</label>
        <input type="text" id="loginAccount" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="submit">登录</button>
    </form>

    <!-- 注册表单 -->
    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>用户名 <span class="optional">*必填</span></label>
        <input type="text" id="regUsername" required>
      </div>
      <div class="form-group">
        <label>密码 <span class="optional">*至少8位，含字母和数字</span></label>
        <input type="password" id="regPassword" required minlength="8" pattern="(?=.*[a-zA-Z])(?=.*\d).{8,}" title="至少8位，需包含字母和数字">
      </div>
      <div class="radio-group">
        <label><input type="radio" name="regType" value="none" checked onchange="toggleRegType()"> 暂不绑定</label>
        <label><input type="radio" name="regType" value="email" onchange="toggleRegType()"> 邮箱注册</label>
        <label><input type="radio" name="regType" value="phone" onchange="toggleRegType()"> 手机号注册</label>
      </div>
      <div class="form-group" id="emailGroup" style="display:none">
        <label>邮箱</label>
        <input type="email" id="regEmail" placeholder="example@domain.com">
      </div>
      <div class="form-group" id="phoneGroup" style="display:none">
        <label>手机号</label>
        <input type="tel" id="regPhone" placeholder="11位手机号" pattern="1[3-9]\d{9}">
      </div>
      <div class="form-group">
        <label>租户 <span class="optional">默认 default</span></label>
        <input type="text" id="regRealm" value="default" placeholder="default">
      </div>
      <button type="submit" class="submit">注册</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script src="/js/device.js"></script>
  <script>
    const API = 'http://localhost:8080';

    async function loadPolicyHint() {
      try {
        const res = await fetch(`${API}/auth/password-policy`);
        const p = await res.json();
        const parts = [];
        parts.push(`至少${p.minLength}位`);
        if (p.requireLetter) parts.push('字母');
        if (p.requireNumber) parts.push('数字');
        if (p.requireSpecial) parts.push('特殊字符');
        const label = document.querySelector('label[for="regPassword"]');
        if (label) {
          label.innerHTML = `密码 <span class="optional">*${parts.join('，含')}</span>`;
        }
        const input = document.getElementById('regPassword');
        if (input) {
          let pattern = `(?=.*[a-zA-Z])`;
          if (p.requireNumber) pattern += `(?=.*\\d)`;
          if (p.requireSpecial) pattern += `(?=.*[^a-zA-Z0-9])`;
          input.pattern = `${pattern}.{${p.minLength},}`;
          input.title = parts.join('，含');
        }
      } catch (e) {}
    }
    loadPolicyHint();

    function switchTab(tab) {
      document.querySelectorAll('.tab button').forEach(b => b.classList.remove('active'));
      if (tab === 'login') {
        document.querySelector('.tab button:first-child').classList.add('active');
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('registerForm').style.display = 'none';
      } else {
        document.querySelector('.tab button:last-child').classList.add('active');
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
      }
      hideMessage();
    }

    function toggleRegType() {
      const type = document.querySelector('input[name="regType"]:checked').value;
      document.getElementById('emailGroup').style.display = type === 'email' ? 'block' : 'none';
      document.getElementById('phoneGroup').style.display = type === 'phone' ? 'block' : 'none';
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }

    function hideMessage() {
      document.getElementById('message').className = 'message';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideMessage();
      const account = document.getElementById('loginAccount').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account, password, deviceId: getDeviceId() })
        });
        const data = await res.json();
        
        if (res.ok) {
          showMessage('登录成功！正在跳转...', 'success');
          setTimeout(() => { location.href = '/login-success.html'; }, 800);
        } else {
          showMessage(data.error || '登录失败', 'error');
        }
      } catch (err) {
        showMessage('网络错误', 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideMessage();
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;
      const type = document.querySelector('input[name="regType"]:checked').value;
      const email = type === 'email' ? document.getElementById('regEmail').value : '';
      const phone = type === 'phone' ? document.getElementById('regPhone').value : '';
      const realm = (document.getElementById('regRealm').value || 'default').trim();

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, phone, password, realm })
        });
        const data = await res.json();
        
        if (res.ok) {
          showMessage('注册成功！正在跳转到登录...', 'success');
          setTimeout(() => { location.href = '/login.html'; }, 1000);
        } else {
          showMessage(data.error || '注册失败', 'error');
        }
      } catch (err) {
        showMessage('网络错误', 'error');
      }
    }
  </script>
</body>
</html>
